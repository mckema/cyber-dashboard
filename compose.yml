# Local stack: self-hosted Wiki.js 2.x, the Exploit Watch job and a local
# stand-in for the Linear API (linear-mock). One folder per service in stack/.
#
#   docker compose up -d --wait wiki
#   docker compose run --rm job bootstrap                  # once; writes .env
#   docker compose up -d                                   # starts the job loop
#
# Wiki UI: http://localhost:3000 (bound to 127.0.0.1 only).
name: exploit-watch

services:
  wiki:
    # Major tag 2 (2.5.317 when this was written). Never use :latest, which is 3.x
    # with a different API.
    image: ghcr.io/requarks/wiki:2
    environment:
      # SQLite, like the original wiki2.internal.ediphy.io instance.
      DB_TYPE: sqlite
      DB_FILEPATH: /wiki/data/db.sqlite
      # No proxy env here: Wiki.js uses Node's fetch, which ignores HTTP(S)_PROXY,
      # so locale sync fails behind the corporate proxy either way (cosmetic: the
      # wiki chrome shows raw keys such as header.search). See README.md, Known limitations.
    volumes:
      # The image runs as non-root `node` (uid 1000). An empty named volume is
      # seeded from the image's /wiki/data, which is owned by node, so the DB file
      # is writable without a chown step. Do not swap this for a host bind mount
      # without fixing ownership.
      - wiki-data:/wiki/data
      # The image declares VOLUME /wiki/data/content; naming it stops every
      # `down`/`up` from leaving an orphan anonymous volume behind.
      - wiki-content:/wiki/data/content
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # /healthz answers 200 in normal mode; in first-run setup mode every GET
      # returns the setup page (also 200), so "healthy" means "HTTP is up".
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  job:
    build:
      # The crate lives in stack/job; Dockerfile.dockerignore limits the context
      # to Cargo.toml, Cargo.lock and src/.
      context: stack/job
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: wiki,localhost,127.0.0.1
    image: exploit-watch-job
    env_file:
      - path: .env
        required: false   # `exploit-watch bootstrap` creates it on first run
    environment:
      # Containers have no Internet without the proxy (DNS fails). NO_PROXY keeps
      # Wiki.js and linear-mock traffic on the compose network instead of going
      # via the proxy.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: wiki,linear-mock,localhost,127.0.0.1
      # These override any value in .env.
      WIKI_BASE: http://wiki:3000
      STATE_DIR: /app/state
      # Triage tickets go to the linear-mock service by default (the binary's own
      # default is LINEAR_MODE=off). To use a real Linear workspace, set
      # LINEAR_API_URL=https://api.linear.app/graphql, LINEAR_API_KEY and
      # LINEAR_TEAM_ID in .env; these lines only supply the defaults.
      LINEAR_MODE: ${LINEAR_MODE:-live}
      LINEAR_API_URL: ${LINEAR_API_URL:-http://linear-mock:8080/graphql}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-lin_api_mock}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID:-mock-team}
    volumes:
      # Repo bind mount for state/, stack/wiki/page/, .env, the component list and
      # stack/job/tests/fixtures (demo). The working directory /app is the repo root,
      # so runtime paths are relative to it. The binary is in the image: code
      # changes need `docker compose build job`.
      - .:/app
    # The image's entrypoint is `exploit-watch`; this is its subcommand.
    command: ["run", "--every", "${INTERVAL_SECONDS:-21600}"]
    depends_on:
      wiki:
        condition: service_healthy
      linear-mock:
        condition: service_healthy
    restart: unless-stopped

  linear-mock:
    # Local lab only: answers the four Linear GraphQL operations the job uses and
    # keeps issues in state/linear-mock/issues.json, where a person edits state,
    # assignee, due, reason and actor by hand to simulate triage. Not published
    # to the host; only the job reaches it on the compose network.
    build:
      context: stack/linear-mock
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    image: exploit-watch-linear-mock
    environment:
      MOCK_API_KEY: lin_api_mock
      MOCK_TEAM_ID: mock-team
      MOCK_DATA_DIR: /data
    volumes:
      # A directory, not a file: writes go to a temp file and are renamed.
      - ./state/linear-mock:/data
    healthcheck:
      # The runtime image has no curl or wget; the binary checks its own /health.
      test: ["CMD", "linear-mock", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    # PID 1 signal handling, so `docker compose stop` does not wait 10 s.
    init: true
    restart: unless-stopped

volumes:
  wiki-data:
  wiki-content:
