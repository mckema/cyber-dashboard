# Overlay: run the lab's job loop and report-serve against the real Linear test
# workspace instead of linear-mock. Lab only; the workspace holds public feed data
# and a test component list.
#
#   export COMPOSE_PATH_SEPARATOR=:       # Windows defaults to ";"
#   export COMPOSE_FILE=compose.yml:compose.linear-test.yml
#   export COMPOSE_ENV_FILES=.env,state/linear-test/secrets.env
#   docker compose up -d
#
# The key, token and team id stay in state/linear-test/secrets.env (gitignored),
# never in .env: the plain compose.yml reads .env, and a loop restarted without
# this overlay would then send a real key with linear-mock's triage.json.
# The three variables must be set for every `docker compose` call (run, logs,
# up); unset COMPOSE_FILE and COMPOSE_ENV_FILES to go back to linear-mock.
#
# State: a separate STATE_DIR, because issue references in triage.json belong to
# one tracker (README, Known limitations). The wiki page is shared: whichever
# setup wrote last is what the page shows.
services:
  job:
    environment: &linear-test-env
      LINEAR_MODE: live
      LINEAR_API_URL: https://api.linear.app/graphql
      # OAuth app token (client_credentials, 30 days; see LINEAR_APP_TOKEN_EXPIRES),
      # so issues are created by the app, as in production.
      LINEAR_API_KEY: ${LINEAR_APP_TOKEN:?set COMPOSE_ENV_FILES to include state/linear-test/secrets.env}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID:?set COMPOSE_ENV_FILES to include state/linear-test/secrets.env}
      STATE_DIR: /app/state/linear-test/state
      COMPONENTS_FILE: state/components.linear-test.toml
      # Marks reports "TEST DATA" (not production data).
      EW_ENVIRONMENT: test
  report-serve:
    environment: *linear-test-env
