[package]
name = "exploit-watch"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Rebuilds the Cyber Threat Exploit Watch page on Wiki.js from eight public threat feeds."

[[bin]]
name = "exploit-watch"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
hex = "0.4.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "gzip"] }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
zip = { version = "9.2.3", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
