# SAMPLE component list for testing the triage matcher.
#
# This is not a real component list. The entries are plausible stand-ins
# (Rust and UI libraries, container images, infrastructure) chosen to exercise
# every matcher rule; replace this file with your own list (or pass one with
# COMPONENTS_FILE).
#
# Format (see src/triage/components.rs):
#   version    recorded in the triager string of "not relevant" decisions
#   id         unique component id
#   kind       library | image | infra
#   ecosystem  libraries only: GitHub advisory ecosystem ("rust", "npm", ...)
#   names      package or product names, matched case-insensitively
#              (vendor-product rule: lowercase, punctuation dropped)
#   vendors    optional; a vendor-product match then needs one of these vendors
#   cpe        optional CPE 2.3 vendor:product prefixes; left out where unsure

version = "sample-2026-11-04"

# ---------------------------------------------------------------- Rust crates

[[component]]
id = "tokio"
kind = "library"
ecosystem = "rust"
names = ["tokio"]
vendors = ["tokio-rs", "tokio"]
cpe = ["cpe:2.3:a:tokio:tokio"]

[[component]]
id = "hyper"
kind = "library"
ecosystem = "rust"
names = ["hyper"]
vendors = ["hyperium", "hyper"]
cpe = ["cpe:2.3:a:hyper:hyper"]

[[component]]
id = "axum"
kind = "library"
ecosystem = "rust"
names = ["axum"]
vendors = ["tokio-rs"]

[[component]]
id = "rustls"
kind = "library"
ecosystem = "rust"
names = ["rustls"]

[[component]]
id = "serde"
kind = "library"
ecosystem = "rust"
names = ["serde", "serde_json"]

[[component]]
id = "reqwest"
kind = "library"
ecosystem = "rust"
names = ["reqwest"]

# The crate binds the system OpenSSL, so advisories for either count.
[[component]]
id = "openssl"
kind = "library"
ecosystem = "rust"
names = ["openssl", "openssl-sys"]
vendors = ["openssl", "sfackler"]
cpe = ["cpe:2.3:a:openssl:openssl"]

# ---------------------------------------------------------------- npm / UI

[[component]]
id = "react"
kind = "library"
ecosystem = "npm"
names = ["react", "react-dom"]
vendors = ["facebook", "meta"]
cpe = ["cpe:2.3:a:facebook:react"]

[[component]]
id = "vite"
kind = "library"
ecosystem = "npm"
names = ["vite"]
vendors = ["vitejs"]
cpe = ["cpe:2.3:a:vitejs:vite"]

[[component]]
id = "next"
kind = "library"
ecosystem = "npm"
names = ["next", "next.js"]
vendors = ["vercel"]
cpe = ["cpe:2.3:a:vercel:next.js"]

# ---------------------------------------------------------------- container images

[[component]]
id = "nginx"
kind = "image"
names = ["nginx", "nginx open source"]
vendors = ["f5", "nginx"]
cpe = ["cpe:2.3:a:f5:nginx", "cpe:2.3:a:nginx:nginx"]

[[component]]
id = "debian"
kind = "image"
names = ["debian", "debian linux"]
vendors = ["debian"]
cpe = ["cpe:2.3:o:debian:debian_linux"]

# ---------------------------------------------------------------- infrastructure

[[component]]
id = "kubernetes"
kind = "infra"
names = ["kubernetes", "kube-apiserver", "kubelet"]
vendors = ["kubernetes"]
cpe = ["cpe:2.3:a:kubernetes:kubernetes"]

[[component]]
id = "clickhouse"
kind = "infra"
names = ["clickhouse", "clickhouse server"]
vendors = ["clickhouse"]
cpe = ["cpe:2.3:a:clickhouse:clickhouse"]

[[component]]
id = "redpanda"
kind = "infra"
names = ["redpanda"]
vendors = ["redpanda", "redpanda data"]

[[component]]
id = "cloud-spanner"
kind = "infra"
names = ["cloud spanner", "google cloud spanner", "spanner"]
vendors = ["google"]

[[component]]
id = "wikijs"
kind = "infra"
names = ["wiki.js", "wiki"]
vendors = ["requarks"]
cpe = ["cpe:2.3:a:requarks:wiki.js"]
